name: PR Preview

on:
  pull_request:
    paths:
      - "examples/**"
      - "circlelib/**"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshots:
    name: Render example screenshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GL runtime + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libegl1 libgl1 libglx-mesa0 libgles2 libosmesa6

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Render every example .crl to PNG
        run: |
          mkdir -p screenshots
          xvfb-run -a bash -eu -c '
            for ex in examples/*.crl; do
              name=$(basename "$ex" .crl)
              echo "rendering $ex -> screenshots/$name.png"
              python -m circlelib run "$ex" \
                --export-png "screenshots/$name.png" \
                --width 960 --height 540
            done
          '

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-screenshots
          path: screenshots/
          retention-days: 14

      - name: Comment on PR with preview list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'screenshots';
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir).filter(f => f.endsWith('.png'))
              : [];
            const runUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body = [
              '### 📸 Example previews',
              '',
              `Rendered **${files.length}** scene(s) for this PR:`,
              '',
              ...files.map(f => `- \`${f}\``),
              '',
              `Download the full set: [example-screenshots](${runUrl})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
